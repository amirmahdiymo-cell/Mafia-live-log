/* player setup */

#splash .nm{text-align:center;font:700 clamp(60px,20vw,92px)/1.9 var(--dp);padding:0 .15em;margin-bottom:6px;background:linear-gradient(#fffbe9,#f4cf7e);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;-webkit-mask-image:linear-gradient(to left,#000 70%,transparent);mask-image:linear-gradient(to left,#000 70%,transparent);-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:right;mask-position:right;-webkit-mask-size:0 100%;mask-size:0 100%;animation:spWrite 1.8s cubic-bezier(.45,.05,.25,1) 1.8s forwards}

@media (prefers-reduced-motion:reduce){#splash{animation-duration:.01s;animation-delay:1s}#splash *{animation:none!important}#splash .glow,#splash .tx{opacity:1}#splash .tx{transform:none}#splash .ln,#splash .sv{display:none}#splash .or{stroke-dashoffset:0}#splash .nm{-webkit-mask-size:150% 100%;mask-size:150% 100%}#splash .halo{opacity:1;transform:scale(2.2)}#splash .core{opacity:1;transform:scale(5.2)}.logo{animation:none}}

/* side flow */

.act.s2.soft{border-color:#e08a3c88;color:#e08a3c}.act.s2.hard{background:color-mix(in srgb,var(--m) 12%,transparent)}

html .ib.pr.armed{background:var(--m);border-color:transparent;color:#fff;box-shadow:none}.chip.armed{color:var(--m);border-color:var(--m)}

#menu{position:relative;overflow:hidden}

/><g class="sv" style="--d:3.5s"><circle r="6.4" fill="url(#spd)"/><circle r="2" fill="#ffe9b0"/><animateMotion dur="15s" repeatCount="indefinite" begin="3.5s" path="M236,0 a236,92 0 1,0 -472,0 a236,92 0 1,0 472,0"/></g></g><circle class="core" r="3"/></svg><div class="cp"><div class="nm">مدار</div><div class="tx">دفترچه زنده گرداننده</div></div></div>
<header class="top"><div class="wrap">
 <div class="r1"><span class="logo">مدار</span>
  <button class="ib pr" id="menu" type="button" aria-label="منو"><svg class="ic" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button></div>
 <div class="hero" id="hero">
  <div class="sky sky-day"></div><div class="sky sky-night"></div>
  <div class="glyph" aria-hidden="true">
   <svg class="g-sun" viewBox="0 0 48 48"><circle cx="24" cy="24" r="8.5" fill="currentColor" fill-opacity=".25"/><path d="M24 5v5M24 38v5M5 24h5M38 24h5M10.6 10.6l3.5 3.5M33.9 33.9l3.5 3.5M37.4 10.6l-3.5 3.5M14.1 33.9l-3.5 3.5"/></svg>
   <svg class="g-moon" viewBox="0 0 48 48"><path d="M38 28.5A15.5 15.5 0 1 1 19.5 10 12 12 0 0 0 38 28.5z" fill="currentColor" fill-opacity=".22"/></svg>
  </div>
  <div class="hero-txt"><p class="label">فاز فعلی</p><p class="phase-big" id="phl"></p></div>
  <div class="phase-btns"><button class="hbtn hp" id="nx" type="button">فاز بعد<svg class="ic" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button><button class="hbtn hg" id="pv" type="button" aria-label="فاز قبلی">قبلی</button></div>
 </div>
</div></header>
<div class="stk"><div class="wrap"><nav class="seg" id="tabs"></nav></div></div>
<main class="wrap">
 <section id="v-players"><div class="tally" id="tally"></div><div class="pt" id="pt"></div><div class="pg" id="pg"></div></section>
 <section id="v-log" hidden><div id="ll"></div></section>
 <section id="v-report" hidden>
  <div class="g2" id="fl"></div>
  <div class="sub" style="margin-top:14px">ساید برنده</div><div class="win" id="win"></div>
  <div class="sect">موارد پایانی</div><div class="g2" id="ef"></div>
  <div class="sect">عکس گزارش</div><canvas id="cv"></canvas>
  <div style="margin-top:12px"><button class="chip pri" id="save" style="width:100%">ذخیره / ارسال عکس</button></div>
 </section>
</main>
<button class="orbtn" id="orbtn" type="button" aria-label="آماده‌سازی بازی"><span class="oring"><i></i></span><svg viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="17" rx="3"/><path d="M9 4.5h6M9 13l2.2 2.2L15.5 11"/></svg></button>
<div class="scrim" id="scrim" hidden><div class="sheet sh" id="sheet"></div></div>
<div class="toast" id="toast" hidden></div>
<script>
(()=>{
if(window.CanvasRenderingContext2D&&!CanvasRenderingContext2D.prototype.roundRect)CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){r=Math.min(r,w/2,h/2);this.moveTo(x+r,y);this.arcTo(x+w,y,x+w,y+h,r);this.arcTo(x+w,y+h,x,y+h,r);this.arcTo(x,y+h,x,y,r);this.arcTo(x,y,x+w,y,r);this.closePath()};
const KEY='md2-state',$=s=>document.querySelector(s),nf=o=>new Intl.NumberFormat('fa-IR',Object.assign({useGrouping:false},o));
const fa=n=>nf().format(n),pd=v=>String(v).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ACTS=[{k:'rec',n:'توصیه',s:1},{k:'note',n:'تذکر',s:1},{k:'warn',n:'اخطار',s:1},{k:'susp',n:'تعلیق حق رأی',s:2},{k:'sil',n:'سکوت انضباطی',s:2,sub:'سکوت در همان روز'},{k:'kill',n:'کشتن',s:2,sub:'اخراج سریع، بدون ثبت در پروفایل'},{k:'kick',n:'کیک',s:2,sub:'اخراج لحظه‌ای، با ثبت در پروفایل'},{k:'dc',n:'دیس‌کانکت',s:0}];
const AM={};ACTS.forEach(a=>AM[a.k]=a);AM.night={n:'کشته در شب',s:2};AM.vote={n:'اجماع روز',s:2};AM.back={n:'برگشت به بازی',s:0};
const OUTA=['kill','kick','night','vote','back'],SD={c:'🟢',m:'🔴',i:'🟤'},SN={c:'شهروند',m:'مافیا',i:'مستقل'};
const REASONS=['توهین','اکت ممتد','اطلاق نقش','چسباندن نقش','سلب نقش','درخواست اخراج از بازی'];
const TABS=[['players','پلیرها'],['log','لاگ'],['report','گزارش']];
const ACC=[['gold','طلایی','#e0b050'],['blue','آبی','#6aa8f5'],['violet','بنفش','#a78bfa'],['teal','فیروزه‌ای','#3cc3c4']];
const ACCL=[['gold','طلایی','#d9aa4a'],['copper','مسی','#e8793f'],['emerald','زمردی','#2fb67f'],['wine','عنابی','#e0526e']];
const accList=t=>t==='light'?ACCL:ACC,accKey=t=>t==='light'?'md2-acc-l':'md2-acc';
const accFor=t=>{try{const v=localStorage.getItem(accKey(t));if(accList(t).some(a=>a[0]===v))return v}catch(e){}return'gold'};
const XI='<svg class="ic" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>';
const store=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
const seat=i=>'بازیکن '+fa(i+1);
function hm(){try{const p={};new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Tehran',hourCycle:'h23',hour:'2-digit',minute:'2-digit'}).formatToParts(new Date()).forEach(x=>p[x.type]=x.value);return p.hour+':'+p.minute}catch(e){const d=new Date();return String(d.getHours()).padStart(2,0)+':'+String(d.getMinutes()).padStart(2,0)}}
function today(){try{return new Intl.DateTimeFormat('fa-IR-u-ca-persian',{timeZone:'Asia/Tehran',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date())}catch(e){return ''}}
const def=(n=10)=>({players:Array.from({length:n},(_,i)=>({id:i+1,name:seat(i)})),log:[],phase:{t:'day',n:1},info:{g1:'',g2:'',scenario:'',date:today(),start:'',finish:''},side:'',end:{dc:'',beh:'',bug:'',exp:''},tab:'players',uid:n+1});
function load(){try{const o=JSON.parse(localStorage.getItem(KEY)||'null');if(o&&Array.isArray(o.players)){const d=def(),r=Object.assign(d,o,{info:Object.assign(d.info,o.info||{}),end:Object.assign(d.end,o.end||{})});r.players.forEach((q,i)=>{if(q.name==='پلیر '+fa(i+1))q.name=seat(i)});return r}}catch(e){}return def()}
let S=load(),cur=null,paint=false,brush='m',tt;
const hasI=()=>S.hasInd!==undefined?!!S.hasInd:S.players.some(p=>p.side==='i'),sidesOn=()=>hasI()?['c','m','i']:['c','m'],indOwner=p=>S.players.find(q=>q.side==='i'&&q!==p);
const save=()=>store(KEY,JSON.stringify(S));
const pl=l=>(l.t==='day'?'روز ':'شب ')+fa(l.n),nameOf=id=>{const p=S.players.find(x=>x.id===id);return p?p.name:'—'},mk=id=>{const p=S.players.find(x=>x.id===id);return p&&SD[p.side]?SD[p.side]+' ':''};
function toast(m,undo){const e=$('#toast');e.innerHTML='';const s=document.createElement('span');s.textContent=m;e.append(s);if(undo){const b=document.createElement('button');b.textContent='برگردان';b.onclick=()=>{undo();e.hidden=true};e.append(b)}e.hidden=false;clearTimeout(tt);tt=setTimeout(()=>e.hidden=true,undo?6000:2200)}
function stats(id){const es=S.log.filter(e=>e.pid===id),c={};es.forEach(e=>c[e.act]=(c[e.act]||0)+1);const last=[...es].reverse().find(e=>OUTA.includes(e.act));return{c,out:last&&last.act!=='back'?last:null}}
const outL=e=>{const P=e.ph.replace(/ /g,'\u00a0');return e.act==='night'?'کشته در '+P:e.act==='vote'?'اجماع در '+P:(e.act==='kill'?'اخراج سریع':'کیک')+' · '+P};
const heat=(c,o)=>o?0:(c.warn>=2||c.susp||c.sil)?3:c.warn?2:(c.note||c.rec)?1:0;
const DCI='<svg viewBox="0 0 24 24"><path d="M12 20h.01"/><path d="M8.5 16.4a5 5 0 0 1 7 0"/><path d="M5 12.9a10 10 0 0 1 5.2-2.7"/><path d="M19 12.9a10 10 0 0 0-2-1.5"/><path d="M2 8.8a15 15 0 0 1 4.2-2.6"/><path d="M22 8.8a15 15 0 0 0-11.3-3.8"/><path d="m2 2 20 20"/></svg>';
const dcb=(c,x)=>c.dc?`<span class="dcb${x?' in':''}" title="دیس‌کانکت" aria-label="دیس‌کانکت">${DCI}${c.dc>1?fa(c.dc):''}</span>`:'';
const tags=(c,o)=>ACTS.filter(a=>a.k!=='dc'&&c[a.k]&&!(o&&a.k===o.act)).map(a=>`<span class="t s${a.s}">${a.n}${c[a.k]>1?' ×'+fa(c[a.k]):''}</span>`).join('');
function record(pid,act,note){if(!S.info.start){S.info.start=hm();$('#start').value=S.info.start}const e={id:S.uid++,pid,act,note:note||'',time:pd(hm()),ph:pl(S.phase)};S.log.push(e);save();renderAll();return e}
function removeEntry(id){const i=S.log.findIndex(e=>e.id===id);if(i<0)return;const[e]=S.log.splice(i,1);save();renderAll();return e}

/* header + tabs */
function renderTop(){$('#phl').textContent=pl(S.phase);document.documentElement.dataset.phase=S.phase.t==='night'?'night':'day';
 $('#tabs').innerHTML=TABS.map(([k,n])=>`<button class="${S.tab===k?'on':''}" data-t="${k}">${n}${k==='log'&&S.log.length?`<span class="bdg">${fa(S.log.length)}</span>`:''}</button>`).join('');
 $('#tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>setTab(b.dataset.t));
 TABS.forEach(([k])=>$('#v-'+k).hidden=S.tab!==k)}
function setTab(k){S.tab=k;save();renderAll();if(k==='report')draw();scrollTo(0,0)}
$('#nx').onclick=()=>{const p=S.phase;S.phase=p.t==='day'?{t:'night',n:p.n}:{t:'day',n:p.n+1};save();renderTop();toast('فاز: '+pl(S.phase),()=>{S.phase=p;save();renderTop()})};
$('#pv').onclick=()=>{const p=S.phase,q=p.t==='night'?{t:'day',n:p.n}:p.n>1?{t:'night',n:p.n-1}:null;if(!q)return;S.phase=q;save();renderTop();toast('فاز: '+pl(q),()=>{S.phase=p;save();renderTop()})};

/* players */
let OUTSEEN=null;
function renderPlayers(){const n=S.players.length,M=Math.floor(n/2),odd=n%2===1;
 const place=i=>{const q=i+1;if(odd&&q===M+1)return'grid-column:1/-1;grid-row:'+q+';justify-self:center;width:calc(50% - 5px)';return q<=M?'grid-column:2;grid-row:'+q:'grid-column:1;grid-row:'+(n-q+1)};
 $('#pg').innerHTML=S.players.map((p,i)=>{const{c,out}=stats(p.id),h=heat(c,out);
  return `<button class="pl${out?' is-out':''}" data-pid="${p.id}" data-s="${SD[p.side]?p.side:''}" data-h="${h}" style="${place(i)}"><span class="band">${fa(i+1)}</span><span class="bd"><b class="nm">${esc(p.name)}</b><span class="tg">${out?`<span class="t s2">${esc(outL(out))}</span>`:''}${!out&&c.warn>=2?'<span class="t">مرحله دوم؟</span>':''}${tags(c,out)}</span></span><span class="heat">${[1,2,3].map(k=>`<i class="${h>=k?'f':''}"></i>`).join('')}</span>${dcb(c)}</button>`}).join('');
 {const now=new Set(S.players.filter(p=>stats(p.id).out).map(p=>p.id));if(OUTSEEN)$('#pg').querySelectorAll('.pl.is-out').forEach(b=>{if(!OUTSEEN.has(+b.dataset.pid)){b.classList.add('just-out');b.addEventListener('animationend',()=>b.classList.remove('just-out'),{once:true})}});OUTSEEN=now}
 $('#pg').querySelectorAll('.pl').forEach(b=>b.onclick=()=>{const id=+b.dataset.pid;if(paint){const p=S.players.find(x=>x.id===id);p.side=p.side===brush?'':brush;save();renderAll()}else openSheet(id)})}
function renderDock(){const T={c:0,m:0,i:0,'':0};let al=0;S.players.forEach(p=>{if(!stats(p.id).out){al++;T[SD[p.side]?p.side:'']++}});
 const gone=S.players.length-al;
 $('#tally').innerHTML=`<div class="ty"><div class="al"><b>${fa(al)}</b><small>زنده از ${fa(S.players.length)}</small></div><div class="sd3">${sidesOn().map(k=>`<div class="sc ${k}"><b>${fa(T[k])}</b><small>${SN[k]}</small></div>`).join('')}${T['']?`<div class="sc u"><b>${fa(T[''])}</b><small>بدون ساید</small></div>`:''}</div></div><div class="bar">${[['c','kc'],['m','km'],['i','ki'],['','k']].map(([k,c])=>T[k]?`<i class="${c}" style="flex:${T[k]}"></i>`:'').join('')}</div>${gone?`<p class="out">${fa(gone)} نفر از بازی خارج شده‌اند</p>`:''}`}
function renderPaint(){const n=S.players.length,ks=sidesOn(),set=S.players.filter(p=>SD[p.side]).length,left=n-set,done=left===0&&n>0;
 const showSetup=!S.noSetup&&!done&&S.log.length===0;
 $('#pt').innerHTML=showSetup?`<div class="stc"><div class="row"><b>شروع بازی</b><button class="x" id="stx" aria-label="بستن">${XI}</button></div><div class="ag"><button class="act s1" id="st1"><b>بازیکنان</b><small>تعداد و اسم</small></button><button class="act s1" id="st2"><b>تعیین ساید</b><small>${fa(left)} نفر بدون ساید</small></button></div></div>`:'';
 if(showSetup){$('#st1').onclick=openSetup;$('#st2').onclick=openSideFlow;$('#stx').onclick=()=>{S.noSetup=1;save();renderPaint()}}
 let f=$('#fab');if(!f){f=document.createElement('button');f.id='fab';f.type='button';f.onclick=openSideFlow;document.body.append(f)}
 f.hidden=S.tab!=='players'||done||showSetup;f.className='fab'+(done?' done':'')+(set?'':' new');
 f.setAttribute('aria-label',done?'ویرایش ساید بازیکن‌ها':'تعیین ساید بازیکن‌ها');
 f.innerHTML=`<span class="ic">${ks.map(k=>`<i style="--k:var(--${k})"></i>`).join('')}</span>${done?'':`<b>تعیین ساید</b>${left?`<em>${fa(left)}</em>`:''}`}`;
 const wi=document.querySelector('[data-w="i"]');if(wi)wi.style.display=(hasI()||S.side==='مستقل')?'':'none'}
/* تعیین ساید مرحله‌به‌مرحله */
let sfi=0;
function openSideFlow(){const k=S.players.findIndex(p=>!SD[p.side]);sfi=k<0?0:k;sideStep()}
function setInd(on){S.hasInd=on;if(!on){S.players.forEach(p=>{if(p.side==='i')p.side=''});if(S.side==='مستقل')S.side=''}save();renderAll();sideStep()}
function sideStep(){const n=S.players.length,ks=sidesOn(),sw=`<div class="sfi"><span>این سناریو «مستقل» دارد</span><button class="sfw${hasI()?' on':''}" id="sfind" role="switch" aria-checked="${hasI()}"><i></i></button></div>`;
 if(sfi>=n){const U={c:0,m:0,i:0,'':0};S.players.forEach(p=>U[SD[p.side]?p.side:'']++);
  openSh(`<div class="row"><div><small style="color:var(--mu)">تعیین ساید</small><h3>همه چیز آماده است</h3></div><button class="x" id="sfx" aria-label="بستن">${XI}</button></div>
  <div class="sfp"><i style="width:100%"></i></div>${sw}
  <div class="sfn">${ks.map(k=>`<div style="--k:var(--${k})"><b>${fa(U[k])}</b><small>${SD[k]} ${SN[k]}</small></div>`).join('')}</div>
  ${U['']?`<p style="color:var(--mu);margin:10px 0 0">${fa(U[''])} نفر هنوز ساید ندارند</p>`:''}
  <div class="sff"><button class="chip" id="sfagain">از اول</button><button class="chip pri" id="sfdone">تمام</button></div>`,sh=>{
   $('#sfx').onclick=$('#sfdone').onclick=closeSh;$('#sfagain').onclick=()=>{sfi=0;sideStep()};$('#sfind').onclick=()=>setInd(!hasI())});return}
 const p=S.players[sfi];
 openSh(`<div class="row"><div><small style="color:var(--mu)">تعیین ساید · ${fa(sfi+1)} از ${fa(n)}</small><h3>${esc(p.name)}</h3></div><button class="x" id="sfx" aria-label="بستن">${XI}</button></div>
 <div class="sfp"><i style="width:${Math.round(sfi/n*100)}%"></i></div>${sw}
 <div class="sfb" style="--n:${ks.length}">${ks.map(k=>`${(()=>{const ow=k==='i'?indOwner(p):null;return `<button class="sfs${p.side===k?' on':''}${ow?' dis':''}" style="--k:var(--${k})" data-sf="${k}"${ow?' data-ow="'+esc(ow.name)+'"':''}><em>${SD[k]}</em><b>${SN[k]}</b>${ow?`<small>برای ${esc(ow.name)} ثبت شده</small>`:''}</button>`})()}`).join('')}</div>
 <div class="sff"><button class="chip" id="sfprev"${sfi?'':' disabled'}>قبلی</button><button class="chip" id="sfrest">بقیه شهروند</button><button class="chip" id="sfskip">بعدی</button></div>`,sh=>{
  $('#sfx').onclick=closeSh;$('#sfind').onclick=()=>setInd(!hasI());
  $('#sfprev').onclick=()=>{if(sfi>0){sfi--;sideStep()}};$('#sfskip').onclick=()=>{sfi++;sideStep()};
  $('#sfrest').onclick=()=>{S.players.forEach(q=>{if(!SD[q.side])q.side='c'});save();renderAll();sfi=n;sideStep()};
  sh.querySelectorAll('[data-sf]').forEach(b=>b.onclick=()=>{if(b.dataset.ow){toast('مستقل فقط یک نفر است؛ «'+b.dataset.ow+'» مستقل است');return}p.side=b.dataset.sf;save();renderAll();sfi++;sideStep()})})}

/* log */
function renderLog(){const b=$('#ll');if(!S.log.length){b.innerHTML='<div class="empty">هنوز موردی ثبت نشده.<br>در تب پلیرها روی یک پلیر بزن و نوع مورد را انتخاب کن.</div>';return}
 let last=null,h='<div class="tl">';[...S.log].reverse().forEach(e=>{const a=AM[e.act]||{n:e.act,s:0};if(e.ph!==last){h+=`<div class="ph-h">${esc(e.ph)}</div>`;last=e.ph}
  h+=`<div class="lr"><time>${e.time}</time><div class="w"><b>${esc(mk(e.pid)+nameOf(e.pid))}</b> <span class="t s${a.s}">${a.n}</span>${e.note?`<span class="note">${esc(e.note)}</span>`:''}</div><button class="x" data-del="${e.id}" aria-label="حذف">${XI}</button></div>`});
 b.innerHTML=h+'</div>';b.querySelectorAll('[data-del]').forEach(x=>x.onclick=()=>{const e=removeEntry(+x.dataset.del);if(e)toast('حذف شد',()=>{S.log.push(e);S.log.sort((a,b)=>a.id-b.id);save();renderAll()})})}

/* sheets */
let BK=null,hs=false,ign=0;
function pushH(){try{history.pushState({mdSh:1},'');hs=true}catch(e){}}
function openSh(html,fn){const s=$('#sheet');if($('#scrim').hidden)pushH();s.innerHTML='<div class="grab"></div>'+html;s.onclick=e=>e.stopPropagation();
 if(BK){const r=s.querySelector('.row');if(r&&r.firstElementChild){const f=BK,w=document.createElement('div');w.style.cssText='display:flex;gap:8px;align-items:center;min-width:0';const b=document.createElement('button');b.className='x';b.id='bk';b.type='button';b.setAttribute('aria-label','بازگشت');b.textContent='→';b.onclick=()=>f();const first=r.firstElementChild;r.insertBefore(w,first);w.append(b,first)}}
 $('#scrim').hidden=false;s.scrollTop=0;fn&&fn(s)}
function closeSh(){const was=!$('#scrim').hidden;$('#scrim').hidden=true;cur=null;BK=null;if(was&&hs){hs=false;ign++;try{history.back()}catch(e){ign--}}}
let exArm=false,exT=0;
let exE=null,exTT=0;function exMsg(){if(!exE){exE=document.createElement('div');exE.className='extoast';exE.textContent='برای خروج از اپلیکیشن، دو بار بک بزنید';document.body.append(exE)}exE.hidden=false;clearTimeout(exTT);exTT=setTimeout(()=>{exE.hidden=true},2200)}
window.addEventListener('popstate',()=>{if(ign>0){ign--;return}if($('#scrim').hidden){if(exArm){clearTimeout(exT);exArm=false;try{history.back()}catch(e){}return}exArm=true;try{history.pushState({mdApp:1},'')}catch(e){}exMsg();exT=setTimeout(()=>{exArm=false},2200);return}hs=false;const f=BK;if(f){f();pushH()}else{$('#scrim').hidden=true;cur=null}});
$('#scrim').onclick=closeSh;document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSh()});
const RSN={a:REASONS,b:['تکرار تخلف بعد از اخطار','توهین','اکت ممتد','اطلاق نقش','چسباندن نقش'],c:['توهین شدید','سلب نقش','درخواست اخراج از بازی','تخلف سنگین','عدم رعایت قوانین']};
const RG={rec:'a',note:'a',warn:'a',susp:'b',sil:'b',kill:'c',kick:'c'};
/* گام اول: انتخاب نوع مورد */
function openSheet(pid){BK=null;const p=S.players.find(x=>x.id===pid);cur=pid;const idx=S.players.indexOf(p)+1,{c,out}=stats(pid);
 const kd={susp:' soft',sil:' soft',kill:' hard',kick:' hard'};
 const btn=a=>`<button class="act s${a.s}${kd[a.k]||''}" data-do="${a.k}"><b>${a.n}</b>${a.sub?`<small>${a.sub}</small>`:''}</button>`,by=s=>ACTS.filter(a=>a.s===s).map(btn).join('');
 const hist=tags(c,out);

const MINS=10,MAXS=16,NL=/[\r\n\u2028\u2029]/;
function parseNames(t){let ls=String(t||'').replace(/[\u200e\u200f\u202a-\u202e\u2066-\u2069\ufeff]/g,'').split(/[\r\n\u2028\u2029\u0085]+/).map(x=>x.trim()).filter(Boolean);
 if(ls.length===1&&/[،,;؛|\t]/.test(ls[0]))ls=ls[0].split(/[،,;؛|\t]+/).map(x=>x.trim()).filter(Boolean);
 return ls.map(x=>x.replace(/^(?:[\(\[]?[0-9۰-۹٠-٩]{1,2}[\)\]\.\-–—:،]+|[•●▪◦*\-–—✔✅]️?)\s*/,'').trim()).filter(Boolean).map(x=>[...x].slice(0,30).join(''))}
function openSetup(){let n=S.players.length;const names=Array.from({length:MAXS},(_,i)=>{const p=S.players[i];return p&&p.name!==seat(i)?p.name:''});
 openSh(`<div class="row"><div><h3>بازیکنان</h3><small style="color:var(--mu)">تعداد صندلی‌ها و نام هر بازیکن</small></div><button class="x" id="spx" aria-label="بستن">${XI}</button></div>
 <div class="spn"><button id="spm" aria-label="کم کردن">−</button><div><b id="spN"></b><small>نفر</small></div><button id="spp" aria-label="اضافه کردن">+</button></div>
 <button class="chip" id="spi" style="width:100%;margin-top:12px">چسباندن یک‌جای لیست اسم‌ها</button>
 <div id="spb" hidden style="margin-top:10px"><textarea id="spta" rows="6" dir="auto" placeholder="لیست را اینجا paste کن؛ هر اسم در یک خط"></textarea><div class="pb" style="margin-top:8px"><button class="chip" id="spc" style="flex:1">از کلیپ‌بورد</button><button class="chip pri" id="spg" style="flex:1.4">اعمال روی صندلی‌ها</button></div></div>
 <div class="sub">نام‌ها · خالی یعنی «بازیکن N»</div><div class="spl" id="spl"></div>
 <div class="spf"><button class="go" id="sps">ذخیره</button></div>`,sh=>{
  const L=sh.querySelector('#spl');
  const paint=()=>{sh.querySelector('#spN').textContent=fa(n);sh.querySelector('#spm').disabled=n<=MINS;sh.querySelector('#spp').disabled=n>=MAXS;
   while(L.children.length>n)L.lastElementChild.remove();
   for(let i=L.children.length;i<n;i++){const r=document.createElement('label');r.className='spr';
    r.innerHTML=`<span>${fa(i+1)}</span><input type="text" maxlength="30" autocomplete="off" enterkeyhint="next" placeholder="${esc(seat(i))}" aria-label="نام صندلی ${fa(i+1)}">`;
    const inp=r.querySelector('input');
    const fill=t=>{const ls=parseNames(t);if(ls.length<2)return false;ls.forEach((l,k)=>{if(i+k<MAXS)names[i+k]=l});n=Math.max(n,Math.min(MAXS,i+ls.length));paint();toast(fa(Math.min(ls.length,MAXS-i))+' اسم جایگذاری شد');return true};
    inp.addEventListener('input',e=>{const raw=e.data||'';if(NL.test(raw.trim())&&fill(raw))return;names[i]=inp.value});
    inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();const nx=L.children[i+1];nx?nx.querySelector('input').focus():inp.blur()}});
    inp.addEventListener('paste',e=>{const t=(e.clipboardData||window.clipboardData).getData('text')||'';if(NL.test(t.trim())&&fill(t))e.preventDefault()});
    inp.addEventListener('beforeinput',e=>{const t=e.data||(e.dataTransfer&&e.dataTransfer.getData('text'))||'';if(e.cancelable&&NL.test(t.trim())&&fill(t))e.preventDefault()});
    L.append(r)}
   [...L.children].forEach((r,k)=>{r.querySelector('input').value=names[k]||''})};
  sh.querySelector('#spx').onclick=closeSh;
  sh.querySelector('#spm').onclick=()=>{if(n>MINS){n--;paint()}};sh.querySelector('#spp').onclick=()=>{if(n<MAXS){n++;paint()}};

  sh.querySelector('#spc').onclick=async()=>{try{const t=await navigator.clipboard.readText();if(t&&t.trim())sh.querySelector('#spta').value=t;else toast('کلیپ‌بورد خالی است')}catch(e){sh.querySelector('#spta').focus();toast('داخل کادر نگه دار و Paste بزن')}};
  sh.querySelector('#spg').onclick=()=>{const ls=parseNames(sh.querySelector('#spta').value).slice(0,MAXS);if(!ls.length){toast('لیستی وارد نشده');return}
   names.fill('');ls.forEach((l,k)=>names[k]=l);n=Math.max(MINS,ls.length);sh.querySelector('#spta').value='';sh.querySelector('#spb').hidden=true;paint();toast(fa(ls.length)+' اسم جایگذاری شد؛ ذخیره را بزن')};
  sh.querySelector('#sps').onclick=()=>{S.players=S.players.slice(0,n);const keep=new Set(S.players.map(p=>p.id)),b4=S.log.length;S.log=S.log.filter(e=>keep.has(e.pid));
   while(S.players.length<n)S.players.push({id:S.uid++,name:seat(S.players.length)});
   S.players.forEach((p,i)=>p.name=(names[i]||'').trim()||seat(i));save();closeSh();renderAll();toast(b4>S.log.length?'ذخیره شد؛ ثبت‌های صندلی‌های حذف‌شده پاک شد':'نام‌ها ذخیره شد')};
  paint()})}

 <div class="spn"><button id="qm" aria-label="کم کردن">−</button><div><b>${fa(N)}</b><small>نفر</small></div><button id="qp" aria-label="اضافه کردن">+</button></div>
 <div class="mn" style="margin-top:12px">${items.map(row).join('')}</div>
 ${done===items.length?'<button class="go" id="pgo" style="margin-top:12px">شروع بازی (ثبت ساعت شروع)</button>':''}`,sh=>{
  sh.querySelector('#qx').onclick=closeSh;
  const setN=n=>{if(n<MINS||n>MAXS||n===S.players.length)return;const oP=S.players.map(p=>({...p})),oL=S.log.slice(),oU=S.uid;
   if(n<S.players.length){S.players=S.players.slice(0,n);const keep=new Set(S.players.map(p=>p.id));S.log=S.log.filter(e=>keep.has(e.pid))}
   else while(S.players.length<n)S.players.push({id:S.uid++,name:seat(S.players.length)});
   save();renderAll();openQuick();
   if(oL.length>S.log.length)toast('ثبت‌های صندلی‌های حذف‌شده پاک شد',()=>{S.players=oP;S.log=oL;S.uid=oU;save();renderAll()})};
  const m=sh.querySelector('#qm'),p=sh.querySelector('#qp');m.disabled=N<=MINS;p.disabled=N>=MAXS;
  m.onclick=()=>setN(N-1);p.onclick=()=>setN(N+1);
  sh.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>items[+b.dataset.r][4]());
  const g=sh.querySelector('#pgo');if(g)g.onclick=()=>{if(!(S.info.start||'').trim()){S.info.start=hm();save();sync()}closeSh();toast('بازی شروع شد؛ ساعت '+pd(S.info.start)+' ثبت شد')};
  setTimeout(()=>{const c=sh.querySelector('#pgc'),d=sh.querySelector('#pgd');if(c)c.style.strokeDashoffset=C*(1-done/items.length);if(d)d.style.transform='rotate('+360*done/items.length+'deg)'},80)})}
function renderAll(){renderTop();renderPlayers();renderDock();renderPaint();renderLog()}
document.fonts&&document.fonts.ready.then(draw);
sync();renderAll();if(S.tab==='report')draw();
try{history.replaceState({mdBase:1},'');history.pushState({mdApp:1},'')}catch(e){}
})();
/* آفلاین: برنامه و فونت‌های نستعلیق در اولین ورود با اینترنت کش می‌شوند */
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}
</script>
</body>
