name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prepare app
        run: |
          mkdir -p www
          cp index.html www/index.html
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/filesystem@6 @capacitor/share@6
          npx cap add android

      - name: Add offline fonts
        run: |
          npm install --no-save @fontsource/estedad @fontsource/noto-nastaliq-urdu
          mkdir -p www/fonts
          cp -r node_modules/@fontsource/estedad www/fonts/estedad
          cp -r node_modules/@fontsource/noto-nastaliq-urdu www/fonts/noto-nastaliq-urdu
          ls www/fonts/estedad www/fonts/noto-nastaliq-urdu

      - name: Generate app icons
        run: |
          ls assets
          npm install --no-save @capacitor/assets
          npx capacitor-assets generate --android

      - name: Build APK
        run: |
          npx cap sync android
          cd android
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: mafia-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
