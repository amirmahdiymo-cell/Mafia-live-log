name: Build Release (Bazaar)

on:
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prepare app
        run: |
          mkdir -p www
          cp index.html www/index.html
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/filesystem@6 @capacitor/share@6
          npx cap add android

      - name: Add offline fonts
        run: |
          npm install --no-save @fontsource/estedad @fontsource/noto-nastaliq-urdu
          mkdir -p www/fonts
          cp -r node_modules/@fontsource/estedad www/fonts/estedad
          cp -r node_modules/@fontsource/noto-nastaliq-urdu www/fonts/noto-nastaliq-urdu

      - name: Generate app icons
        run: |
          npm install --no-save @capacitor/assets
          npx capacitor-assets generate --android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Set version and signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/madar-release.jks
          python3 - <<'PY'
          import os, re
          p = 'android/app/build.gradle'
          s = open(p).read()
          n = os.environ['RUN_NUMBER']
          s, c1 = re.subn(r'versionCode\s+\d+', 'versionCode ' + n, s, count=1)
          s, c2 = re.subn(r'versionName\s+"[^"]*"', 'versionName "1.0.' + n + '"', s, count=1)
          sign = (
              "signingConfigs {\n"
              "        release {\n"
              "            storeFile file(System.getenv('KS_FILE'))\n"
              "            storePassword System.getenv('KS_PASS')\n"
              "            keyAlias System.getenv('KEY_ALIAS')\n"
              "            keyPassword System.getenv('KEY_PASS')\n"
              "        }\n"
              "    }\n"
              "    buildTypes {"
          )
          assert 'buildTypes {' in s, 'buildTypes not found'
          s = s.replace('buildTypes {', sign, 1)
          m = re.search(r'buildTypes \{\s*release \{', s)
          assert m, 'release block not found'
          s = s[:m.end()] + '\n            signingConfig signingConfigs.release' + s[m.end():]
          assert c1 == 1 and c2 == 1, 'version lines not found'
          open(p, 'w').write(s)
          PY

      - name: Build signed APK and AAB
        env:
          KS_FILE: ${{ github.workspace }}/android/app/madar-release.jks
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew assembleRelease bundleRelease

      - name: Show signature fingerprint
        run: |
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | sort | tail -1)
          $APKSIGNER verify --print-certs android/app/build/outputs/apk/release/app-release.apk | grep -i "SHA-256"

      - uses: actions/upload-artifact@v4
        with:
          name: madar-release
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
